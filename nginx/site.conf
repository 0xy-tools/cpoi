server {
    listen 80;
    listen 443 ssl;
    server_name c.0xy.fr
			    cpoi.0xy.fr
				www.cpoi.0xy.fr
                www.c.0xy.fr;
    
    ssl_certificate     /var/www/magictintin/certs/xyc;
    ssl_certificate_key /var/www/magictintin/certs/xyk;

    root /var/www/magictintin/cpoi;

	index index.php;# index.html;

	
    # CORS headers
    add_header Access-Control-Allow-Origin "https://cpoi.softplus.fr";
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
    add_header Access-Control-Allow-Headers "Content-Type";

	location / {
	    index index.php;
	    try_files $uri $uri/ @php_fallback;
	}

	location @php_fallback {
        rewrite ^(.+)$ $1.php last;
    }

    include /var/www/magictintin/php.conf;
}
